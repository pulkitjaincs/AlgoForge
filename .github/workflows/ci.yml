name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, Lint, Test, and E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      REDIS_URL: ${{ vars.REDIS_URL }}
      JWT_SECRET: "test-secret-key-that-is-at-least-32-chars-long-for-e2e"
      CLIENT_URL: http://127.0.0.1:5173
      NODE_ENV: test
      CI: true
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v3
        with:
          version: 10
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript type-check
        run: |
          pnpm --filter @algoforge/shared run build
          pnpm --filter client exec tsc --noEmit
          pnpm --filter algoforge-server exec tsc --noEmit

      - name: Lint All (Turbo)
        run: pnpm run lint

      - name: Build All (Turbo)
        run: pnpm run build

      - name: Unit Tests (Turbo)
        run: pnpm run test:coverage

      - name: Generate Prisma client & Push Schema
        working-directory: server
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm exec playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
