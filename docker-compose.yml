services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: algoforge-api
    ports: ["3001:3001"]
    env_file: ./server/.env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: algoforge-web
    depends_on: [server]
    ports: ["5173:5173"]
